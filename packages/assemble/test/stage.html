<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assemble image-mode stage</title>
    <style>
      body { margin: 0; padding: 48px; font: 15px/1.5 system-ui, sans-serif; background: #f4f4f5; color: #1b1b1f; }
      #stage { position: relative; width: 960px; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid #dedee2; border-radius: 12px; background: #e9e9eb; }
      #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
      p { max-width: 60ch; }
    </style>
  </head>
  <body>
    <div id="stage"><img id="frame" alt="" /></div>
    <p id="says">What the test user said about this page sits here, outside the stage, and must never be touched.</p>
  </body>
</html>
