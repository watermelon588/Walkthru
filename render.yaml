# Render Blueprint for the API (free web service). Dashboard: New > Blueprint > this repo.
# Free instances sleep after 15 idle minutes and take about a minute to wake; see docs/deploy.md.
services:
  - type: web
    name: walkthru-api
    runtime: python
    plan: free
    rootDir: apps/api
    # Pinned, tested versions (SD-9.2), then the app itself without re-resolving.
    buildCommand: pip install -r requirements.lock && pip install . --no-deps
    # --proxy-headers with FORWARDED_ALLOW_IPS below: behind Render's proxy the visitor's address comes from
    # X-Forwarded-For, so the per-address scan limit counts visitors, not the proxy.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Free plan, one instance, 512 MB: agent state in memory (a restart or sleep ends runs mid-way with a partial
      # report) and two queue workers. Production on the VM uses CHECKPOINTER=postgres (docs/deploy.md).
      - key: CHECKPOINTER
        value: memory
      - key: JOB_WORKERS
        value: "2"
      # Set these in the Render dashboard (sync: false keeps them out of this file).
      - key: WEB_URL            # https://YOUR-SITE.vercel.app, no trailing slash (CORS and links in emails)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SCOUT_GEMINI_API_KEY   # optional: Scout in team chat; blank falls back to GOOGLE_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY       # optional: experimental Jev provider
        sync: false
      - key: LANGSMITH_API_KEY      # optional: traces
        sync: false
      - key: LANGSMITH_TRACING
        sync: false
      - key: LANGSMITH_PROJECT
        sync: false
      # Optional: GitHub App for fix pull requests (MCP open_fix_pull_request)
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      # Billing (payment.md). Webhook URL in Dodo: https://YOUR-API.onrender.com/webhooks/dodo
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_BUSINESS_ID
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT   # test_mode until live verification clears
        value: test_mode
      - key: DODO_PRODUCT_LAUNCH
        sync: false
      - key: DODO_PRODUCT_PRO_FOUNDING
        sync: false
      - key: DODO_PRODUCT_PRO
        sync: false
      - key: DODO_PRODUCT_PLUS_FOUNDING
        sync: false
      - key: DODO_PRODUCT_PLUS
        sync: false
      - key: RESEND_API_KEY     # optional: without it "Email me" opens the user's mail app
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: FOUNDER_EMAIL      # optional: where plan requests are emailed (needs RESEND_API_KEY)
        sync: false
