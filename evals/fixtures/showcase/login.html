<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in to Fieldnote</title>
  <meta name="description" content="Log in to your Fieldnote account.">
  <link rel="canonical" href="http://127.0.0.1:8103/login.html">
  <meta property="og:site_name" content="Fieldnote">
  <meta property="og:title" content="Log in to Fieldnote">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">Fieldnote</a>
    <nav aria-label="Main">
      <a href="/pricing.html">Pricing</a>
      <a href="/stories/atlas.html">Customer stories</a>
      <a href="/docs.html">Docs</a>
      <a href="/contact.html">Contact</a>
      <a href="/login.html">Log in</a>
      <a href="/signup.html" class="btn">Start free</a>
    </nav>
  </header>
  <main>
    <h1>Log in</h1>
    <h2>Your account</h2>
    <form action="/welcome.html" method="get">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit" class="btn">Log in</button>
    </form>
    <h2>New to Fieldnote?</h2>
    <p>New here? <a href="/signup.html">Create an account</a></p>
  </main>
  <footer><a href="/pricing.html">Pricing</a> · <a href="/contact.html">Contact</a> · <a href="/privacy.html">Privacy</a></footer>
  <script src="/app.js"></script>
</body>
</html>
