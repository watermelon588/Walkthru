<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your Fieldnote account</title>
  <meta name="description" content="Start free: 5 meetings a month, no card needed.">
  <link rel="canonical" href="http://127.0.0.1:8103/signup.html">
  <meta property="og:site_name" content="Fieldnote">
  <meta property="og:title" content="Create your Fieldnote account">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">Fieldnote</a>
    <nav aria-label="Main">
      <a href="/pricing.html">Pricing</a>
      <a href="/stories/atlas.html">Customer stories</a>
      <a href="/docs.html">Docs</a>
      <a href="/contact.html">Contact</a>
      <a href="/login.html">Log in</a>
      <a href="/signup.html" class="btn">Start free</a>
    </nav>
  </header>
  <main>
    <h1>Create your account</h1>
    <h2>Your details</h2>
    <form id="signup" novalidate>
      <label for="name">Full name</label><input id="name" name="name" autocomplete="name">
      <label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password">
      <p id="signup-error" class="error" role="alert" hidden></p>
      <button type="submit" class="btn">Create account</button>
    </form>
    <h2>Already using Fieldnote?</h2>
    <p>Already have an account? <a href="/login.html">Log in</a></p>
  </main>
  <footer><a href="/pricing.html">Pricing</a> · <a href="/contact.html">Contact</a> · <a href="/privacy.html">Privacy</a></footer>
  <script src="/app.js"></script>
</body>
</html>
