<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Acme Notes: questions and feedback</title>
  <meta name="description" content="Send the Acme Notes team a message. We answer within one working day.">
  <link rel="canonical" href="http://127.0.0.1:8101/contact.html">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a href="/" class="brand">Acme Notes</a></header>
  <main>
    <h1>Contact us</h1>
    <!-- Mirrors a real portfolio pattern: the submit button lives outside the form and links to it with form="contact". -->
    <form id="contact" action="https://127.0.0.1:8101/api/contact" method="post" novalidate>
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required>
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required></textarea>
      <p id="error" role="alert" class="error" hidden></p>
      <p id="sent" role="status" hidden>Thanks! Your message was sent. We reply within one working day.</p>
    </form>
    <aside>
      <button type="submit" form="contact" class="btn" aria-label="Send message">Send message</button>
    </aside>
  </main>
  <script src="/contact.js"></script>
</body>
</html>
