[project]
name = "walkthru-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3",
  "langsmith>=0.12",
  "langchain-anthropic>=1",
  "anthropic[vertex]>=1",  # Claude Haiku 4.5 on Google Cloud for Pro and Plus (approved 2026-09-24)
  "langchain-google-genai>=4",
  "langchain-groq>=1",
  "python-dotenv>=1",
  "email-validator>=2",  # pydantic EmailStr on POST /scans
  "mcp>=2.2,<3",  # Walkthru MCP server for Plus (approved 2026-09-24, docs/decisions.md)
  "httpx>=0.28",
  "selectolax>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["app", "app.agent", "app.scans"]

[tool.ruff]
line-length = 140

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
