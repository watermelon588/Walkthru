[project]
name = "walkthru-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3",
  "langchain-anthropic>=1",
  "langchain-google-genai>=4",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["app", "app.agent"]

[tool.ruff]
line-length = 140
