          const bx = hash(ci, 92) * W, by = hash(ci, 93) * H, br = 150 + lt * 2600, gr = g.createRadialGradient(bx, by, 0, bx, by, br), k = (1 - lt / 0.3) ** 2;
          gr.addColorStop(0, hash(ci, 94) < 0.5 ? `rgba(143,198,199,${0.55 * k})` : `rgba(229,72,77,${0.55 * k})`);
          gr.addColorStop(1, "rgba(0,0,0,0)");
          g.globalCompositeOperation = "lighter"; g.fillStyle = gr; g.fillRect(0, 0, W, H); g.globalCompositeOperation = "source-over";
        }

        // scribbles, boiling at 12 fps like a pen that will not stop
        const js = Math.floor(t * 12);
        g.lineCap = "round"; g.lineJoin = "round";
        for (let k = 0; k < SCR.length && SCR[k].ts <= t; k++) {
          const s = SCR[k];
          if (t > s.ts + s.life) continue;
          g.globalCompositeOperation = s.mode === 0 ? "difference" : "source-over";
          g.strokeStyle = s.mode === 0 ? "#fff" : s.mode === 1 ? C.red : C.signal;
          g.lineWidth = s.width;
          drawPath(g, s.pts, clamp((t - s.ts) / s.dur), js * 131 + k, 5);
        }
        g.globalCompositeOperation = "difference"; g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left";
        for (const th of THO) {
          if (th.ts > t) break;
          g.font = `500 ${th.size}px "Geist Mono"`;
          const len = th.txt.length * th.size * 0.6, d = (t - th.ts) * th.speed;
          if (d > W + len) continue;
          g.fillText(th.txt, th.dir > 0 ? d - len : W - d, th.y);
        }
        g.globalCompositeOperation = "source-over";
        drawHud(t, frame);

        if (SUBLIM.some((s) => t >= s && t < s + 2 / 60)) { // two frames of Scout, almost subliminal
          plate(0, 0, W, H, frame % 2 ? C.red : C.paper);
          g.drawImage(IMG.still, W / 2 - 460, H / 2 - 455, 920, 910);
        }
        if (lt < (cut.d >= 0.1 ? 2 : 1) / 60) plate(0, 0, W, H, `rgba(255,255,255,${cut.d >= 0.1 ? 0.4 : 0.18})`);
        if (t > 7.6 && hash(frame, 3) < 0.35) { g.globalCompositeOperation = "difference"; plate(0, 0, W, H, "#fff"); g.globalCompositeOperation = "source-over"; }
        if (t > CH - 0.6) { const q = (t - CH + 0.6) / 0.6; plate(0, 0, W, H, `rgba(244,244,245,${Math.min(0.92, q * q * (0.7 + 0.3 * hash(frame, 6)))})`); }
        if (t > CH - 0.35) { g.strokeStyle = C.red; g.lineWidth = 7; drawPath(g, KNOT, clamp((t - CH + 0.35) / 0.25), frame >> 2, 6); }
      }

      // ------------------------------------------------------------ the calm
      function drawCalm(t) {
        g2.setTransform(1, 0, 0, 1, 0, 0); g2.clearRect(0, 0, W, H);
        const fade = eio3(clamp((t - EN.fadeA) / (EN.fadeB - EN.fadeA))), alpha = 1 - clamp((t - EN.lineA) / (EN.lineB - EN.lineA));
        if (alpha <= 0) return;
        const u = clamp((t - EN.untA) / (EN.untB - EN.untA)), n = KNOT.length;
        const vib = t > EN.untB ? 18 * Math.sin(2 * Math.PI * 7 * (t - EN.untB)) * Math.exp(-(t - EN.untB) * 3.2) : 0;
        const col = fade < 0.5 ? [244, 244, 245] : [27, 27, 31]; // flips at mid-grey so it never matches the background
        const xmax = lerp(1720, 560, eio3(clamp((t - (EN.wordA - 0.3)) / 0.5)));
        g2.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`; g2.lineWidth = lerp(7, 3, u); g2.lineCap = "round"; g2.lineJoin = "round"; g2.beginPath();
        for (let i = 0; i < n; i++) {
          const q = eio3(clamp((u - (0.4 * i) / n) / 0.6)), tx = -20 + (1740 * i) / (n - 1), ty = LINE_Y + vib * Math.sin((Math.PI * i) / (n - 1));
          const x = lerp(KNOT[i][0], tx, q);
          if (u >= 1 && x > xmax) break;
          g2.lineTo(x, lerp(KNOT[i][1], ty, q));
        }
        g2.stroke();
      }

      // ------------------------------------------------------------ build once fonts and images are ready
      (async () => {
        await Promise.all(["900 100px Geist", "300 100px Geist", "600 30px Geist", "500 30px Geist", '500 30px "Geist Mono"', '600 30px "Geist Mono"'].map((f) => document.fonts.load(f)));
        const ids = { eye: "im-eye", phone: "im-phone", owner: "im-owner", buyer: "im-buyer", signup: "im-signup", returning: "im-returning", sink: "im-sink", steal: "im-steal", spaper: "im-spaper", still: "still" };
        await Promise.all(Object.entries(ids).map(async ([k, id]) => { const el = document.getElementById(id); await el.decode().catch(() => {}); IMG[k] = el; }));

        const tl = gsap.timeline({ paused: true });
        const mark = $("#wordmark .mask"), text = mark.textContent;
        mark.textContent = "";
        const letters = [...text].map((ch) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; s.setAttribute("data-layout-allow-occlusion", ""); s.setAttribute("data-layout-allow-overflow", ""); mark.appendChild(s); return s; });
        tl.fromTo("#calm-bg", { backgroundColor: C.ink }, { backgroundColor: C.paper, duration: EN.fadeB - EN.fadeA, ease: "power2.inOut" }, EN.fadeA);
        tl.fromTo(letters, { yPercent: 110 }, { yPercent: 0, duration: 0.8, stagger: 0.07, ease: "expo.out" }, EN.wordA);
        tl.fromTo("#tagline", { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power2.out" }, EN.tagA);
        tl.fromTo("#grain", { opacity: 0.1 }, { opacity: 0.05, duration: 0.6, ease: "none", immediateRender: false }, CH);

        const bird = $("#bird"), still = $("#still"), grain = $("#grain");
        const clock = { t: 0 };
        function render(t) {
          const [gx, gy] = [hash(Math.floor(t * 24), 11), hash(Math.floor(t * 24), 12)];
          grain.style.transform = `translate(${Math.round(gx * 256)}px, ${Math.round(gy * 256)}px)`;
          if (t < CH) { drawChaos(t); return; }
          drawCalm(t);
          const p = clamp((t - EN.walkA) / (EN.walkB - EN.walkA)), x = lerp(EN.x0, 0, eo3(p));
          bird.style.transform = `translateX(${x.toFixed(1)}px)`;
          bird.style.backgroundPosition = `${-(Math.floor(((x - EN.x0) / EN.stride) * 24) % 24) * 243}px 0`;
          bird.style.opacity = t >= EN.walkA && p < 1 ? 1 : 0;
          still.style.opacity = p >= 1 ? 1 : 0;
        }
        tl.to(clock, { t: WT.total, duration: WT.total, ease: "none", onUpdate: () => render(clock.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
